<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZivoraFashionHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">
    
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <h1 class="text-3xl font-extrabold text-indigo-600 tracking-tight">ZIVORA</h1>
                    <span class="ml-2 text-sm font-medium text-gray-500 hidden sm:block">Fashion Hub</span>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="#" class="text-gray-900 hover:text-indigo-600 font-medium">Mukhya Page</a>
                    <a href="#trending" class="text-gray-600 hover:text-indigo-600 font-medium">Naye Kapde</a>
                </div>
                <div class="flex items-center space-x-5">
                    <button class="text-gray-500 hover:text-indigo-600"><i data-lucide="search" class="w-6 h-6"></i></button>
                    <button class="text-gray-500 hover:text-indigo-600 relative" onclick="addToCart()">
                        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                        <span id="cart-badge" class="hidden absolute -top-2 -right-2 bg-rose-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center animate-bounce">0</span>
                    </button>
                    <button class="md:hidden text-gray-500 hover:text-indigo-600" onclick="toggleMenu()">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t px-4 py-4 space-y-2 shadow-lg">
            <a href="#" class="block text-gray-900 font-medium">Mukhya Page</a>
            <a href="#trending" class="block text-gray-600 font-medium">Naye Kapde</a>
        </div>
    </nav>

    <div class="relative bg-gray-900">
        <div class="absolute inset-0">
            <img class="w-full h-full object-cover opacity-60" src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80" alt="Fashion Models">
            <div class="absolute inset-0 bg-gradient-to-r from-gray-900 to-transparent mix-blend-multiply"></div>
        </div>
        <div class="relative max-w-7xl mx-auto py-24 px-4 sm:py-32 flex flex-col items-start">
            <h1 class="text-4xl font-extrabold text-white sm:text-5xl">Naya Season, <span class="text-indigo-400">Naya Style</span></h1>
            <p class="mt-6 text-xl text-gray-300 max-w-xl">Zivora ke exclusive collection ke sath apne wardrobe ko update karein.</p>
            <button class="mt-8 bg-indigo-600 rounded-full py-3 px-8 text-white hover:bg-indigo-700 shadow-lg font-medium">Abhi Kharidein</button>
        </div>
    </div>

    <div id="trending" class="bg-white py-16">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-10 text-center">Grahakon Ki Pasand</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="bg-white border border-gray-100 rounded-2xl overflow-hidden hover:shadow-xl transition-shadow">
                    <div class="h-64 relative overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1572804013309-82a89b436437?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover" alt="Dress">
                        <span class="absolute top-3 left-3 bg-rose-500 text-white text-xs font-bold px-2 py-1 rounded">SALE</span>
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-semibold text-gray-900">Floral Summer Dress</h3>
                        <div class="mt-3 flex justify-between items-center">
                            <span class="text-xl font-bold">₹1,499</span>
                            <button onclick="addToCart()" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg hover:bg-indigo-600 hover:text-white transition-colors"><i data-lucide="shopping-bag" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl overflow-hidden hover:shadow-xl transition-shadow">
                    <div class="h-64 relative overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover" alt="Jacket">
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-semibold text-gray-900">Premium Leather Jacket</h3>
                        <div class="mt-3 flex justify-between items-center">
                            <span class="text-xl font-bold">₹3,999</span>
                            <button onclick="addToCart()" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg hover:bg-indigo-600 hover:text-white transition-colors"><i data-lucide="shopping-bag" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Icons load karna
        lucide.createIcons();
        
        // Cart Logic
        let count = 0;
        function addToCart() {
            count++;
            const badge = document.getElementById('cart-badge');
            badge.innerText = count;
            badge.classList.remove('hidden');
        }

        // Mobile Menu Logic
        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }
    </script>
</body>
</html>
