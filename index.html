<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zivora Fashion Hub</title>

<style>
body { margin:0; font-family:Arial; background:#f1f3f6; }

/* Navbar */
.navbar {
    background:#2874f0;
    color:white;
    display:flex;
    padding:10px;
    align-items:center;
}

.logo { font-size:20px; font-weight:bold; }

.search { flex:1; margin:0 15px; }
.search input { width:100%; padding:8px; border:none; }

.cart { cursor:pointer; }

/* Product Grid */
.products {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    padding:20px;
}

.card {
    background:white;
    padding:10px;
    text-align:center;
    border-radius:5px;
}

.card img {
    width:100%;
    height:200px;
    object-fit:cover;
}

/* Buttons */
button {
    background:#ff9f00;
    border:none;
    padding:8px;
    color:white;
    cursor:pointer;
}

/* Cart */
.cart-box {
    position:fixed;
    right:0;
    top:0;
    width:300px;
    height:100%;
    background:white;
    padding:10px;
    display:none;
    overflow:auto;
}

/* Admin Panel */
.admin {
    background:white;
    padding:15px;
    margin:10px;
}
</style>

</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">Zivora</div>
    <div class="search">
        <input type="text" placeholder="Search products...">
    </div>
    <div class="cart" onclick="toggleCart()">🛒 (<span id="count">0</span>)</div>
</div>

<!-- Admin Panel -->
<div class="admin">
    <h3>Add Product (Admin)</h3>
    <input id="pname" placeholder="Product Name"><br><br>
    <input id="pprice" placeholder="Price"><br><br>
    <input id="pimg" placeholder="Image URL"><br><br>
    <button onclick="addProduct()">Add Product</button>
</div>

<!-- Products -->
<div class="products" id="productList"></div>

<!-- Cart -->
<div class="cart-box" id="cartBox">
    <h2>Cart</h2>
    <ul id="cartItems"></ul>
    <h3>Total ₹<span id="total">0</span></h3>
    <button onclick="orderWhatsApp()">Order on WhatsApp</button>
</div>

<script>
let products = [
    {name:"Kurti", price:499, img:"https://via.placeholder.com/200"},
    {name:"Saree", price:999, img:"https://via.placeholder.com/200"}
];

let cart = [];
let total = 0;

function renderProducts(){
    let html = "";
    products.forEach((p,i)=>{
        html += `
        <div class="card">
            <img src="${p.img}">
            <h4>${p.name}</h4>
            <p>₹${p.price}</p>
            <button onclick="addToCart(${i})">Add</button>
        </div>`;
    });
    document.getElementById("productList").innerHTML = html;
}

function addProduct(){
    let name = document.getElementById("pname").value;
    let price = document.getElementById("pprice").value;
    let img = document.getElementById("pimg").value;

    products.push({name, price, img});
    renderProducts();
}

function addToCart(i){
    cart.push(products[i]);
    total += Number(products[i].price);

    document.getElementById("count").innerText = cart.length;

    let li = document.createElement("li");
    li.innerText = products[i].name + " ₹" + products[i].price;
    document.getElementById("cartItems").appendChild(li);

    document.getElementById("total").innerText = total;
}

function toggleCart(){
    let box = document.getElementById("cartBox");
    box.style.display = box.style.display === "block" ? "none" : "block";
}

function orderWhatsApp(){
    let msg = "Order Details:\n";
    cart.forEach(item=>{
        msg += item.name + " ₹" + item.price + "\n";
    });
    msg += "Total ₹" + total;

    window.open("https://wa.me/919102211369?text=" + encodeURIComponent(msg));
}

renderProducts();
</script>

</body>
</html>
