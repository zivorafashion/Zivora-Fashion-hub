<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zivorafashionhub | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .hidden { display: none; }
        .admin-sidebar { transition: 0.3s; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div id="user-view">
        <nav class="bg-indigo-700 text-white p-4 sticky top-0 z-50 shadow-md">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold">Zivora Fashion Hub</h1>
                <button onclick="showAdminLogin()" class="text-xs bg-indigo-800 px-2 py-1 rounded opacity-50 hover:opacity-100">Admin Login</button>
            </div>
        </nav>

        <div class="p-10 text-center">
            <h2 class="text-3xl font-bold text-gray-800">Welcome to Zivora</h2>
            <p class="text-gray-600 mt-2 text-lg">Mango, Jamshedpur's Premium Fashion Destination</p>
            <div class="mt-10 grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto">
                <div class="bg-white p-6 shadow rounded-xl font-bold">Sarees</div>
                <div class="bg-white p-6 shadow rounded-xl font-bold">Kurti & Suits</div>
                <div class="bg-white p-6 shadow rounded-xl font-bold">Bridal Wear</div>
                <div class="bg-white p-6 shadow rounded-xl font-bold">Jewellery</div>
            </div>
        </div>
    </div>

    <div id="admin-login" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] p-4">
        <div class="bg-white p-8 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <i data-lucide="lock" class="w-12 h-12 text-indigo-600 mx-auto mb-4"></i>
            <h2 class="text-2xl font-bold mb-4">Admin Passcode</h2>
            <input type="password" id="passcode-input" placeholder="Enter Passcode" class="w-full border p-3 rounded-lg mb-4 text-center text-xl tracking-widest focus:ring-2 focus:ring-indigo-500 outline-none">
            <div class="flex gap-2">
                <button onclick="closeAdminLogin()" class="flex-1 bg-gray-200 py-3 rounded-lg font-bold">Cancel</button>
                <button onclick="checkPasscode()" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-bold">Login</button>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="hidden fixed inset-0 bg-white z-[200] flex flex-col md:flex-row">
        <div class="bg-indigo-900 text-white w-full md:w-64 p-6 flex flex-col gap-6">
            <h2 class="text-xl font-bold border-b border-indigo-700 pb-4">Zivora Admin</h2>
            <nav class="flex flex-col gap-4">
                <button onclick="setAdminTab('dash')" class="flex items-center gap-3 hover:bg-indigo-800 p-2 rounded"><i data-lucide="layout-dashboard"></i> Dashboard</button>
                <button onclick="setAdminTab('settings')" class="flex items-center gap-3 hover:bg-indigo-800 p-2 rounded"><i data-lucide="settings"></i> Site Settings</button>
                <button onclick="logoutAdmin()" class="flex items-center gap-3 text-red-300 mt-10 p-2"><i data-lucide="log-out"></i> Logout</button>
            </nav>
        </div>

        <div class="flex-1 p-6 overflow-y-auto">
            <div id="tab-dash">
                <h3 class="text-2xl font-bold mb-6">Business Overview</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-green-100 p-6 rounded-xl border-l-4 border-green-500">
                        <p class="text-green-700 font-bold">Total Sales</p>
                        <p class="text-3xl font-black">₹45,200</p>
                    </div>
                    <div class="bg-blue-100 p-6 rounded-xl border-l-4 border-blue-500">
                        <p class="text-blue-700 font-bold">New Orders</p>
                        <p class="text-3xl font-black">12</p>
                    </div>
                    <div class="bg-purple-100 p-6 rounded-xl border-l-4 border-purple-500">
                        <p class="text-purple-700 font-bold">Total Products</p>
                        <p class="text-3xl font-black">48</p>
                    </div>
                </div>
            </div>

            <div id="tab-settings" class="hidden">
                <h3 class="text-2xl font-bold mb-6">Manage Store Info</h3>
                <div class="max-w-xl bg-gray-50 p-6 rounded-xl border">
                    <label class="block mb-2 font-bold">CEO Name</label>
                    <input type="text" value="Nishant Gupta" class="w-full p-2 border rounded mb-4">
                    
                    <label class="block mb-2 font-bold">Phone / WhatsApp</label>
                    <input type="text" value="+91 9341815469" class="w-full p-2 border rounded mb-4">

                    <label class="block mb-2 font-bold">Store Address</label>
                    <textarea class="w-full p-2 border rounded mb-4" rows="3">Ram Nagar Dimna Road 1, Mango, Jamshedpur, Jharkhand - 831012</textarea>
                    
                    <button onclick="alert('Settings Saved Successfully!')" class="bg-indigo-600 text-white px-6 py-2 rounded font-bold">Save All Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function showAdminLogin() { document.getElementById('admin-login').classList.remove('hidden'); }
        function closeAdminLogin() { document.getElementById('admin-login').classList.add('hidden'); }

        function checkPasscode() {
            const code = document.getElementById('passcode-input').value;
            if(code === "1234") { // Default Passcode: 1234
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('user-view').classList.add('hidden');
            } else {
                alert("Galat Passcode! Try Again.");
            }
        }

        function setAdminTab(tab) {
            document.getElementById('tab-dash').classList.add('hidden');
            document.getElementById('tab-settings').classList.add('hidden');
            document.getElementById('tab-' + tab).classList.remove('hidden');
        }

        function logoutAdmin() {
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('user-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
